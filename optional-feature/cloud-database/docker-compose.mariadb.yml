# ======================================================
# MariaDB server for yt-downloader v3.0.0 (cloud history backend)
#
# Deploy THIS file on your cloud host / VPS -- NOT on the PCs running
# the downloader app. It provisions the shared MariaDB server that all
# local PCs point to via DB_URI.
#
# Usage:
#   cp docker-compose.mariadb.env.example .env        # edit credentials
#   docker compose -f docker-compose.mariadb.yml up -d
#   docker compose -f docker-compose.mariadb.yml ps   # wait health = healthy
#
# Then on every PC set in the app .env (tunnel = recommended, no open port):
#   DB_MODE=cloud
#   DB_URI=mysql://$DB_USER:$DB_PASSWORD@127.0.0.1:3307/$DB_DATABASE
#   # + CF_TUNNEL_HOSTNAME / CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET
#
# For direct-VPS-IP access (Option B) instead use in the app .env:
#   DB_URI=mysql://$DB_USER:$DB_PASSWORD@<CLOUD_IP>:<PORT>/$DB_DATABASE
#   # and add a 'ports:' mapping below + open the port ONLY to your PC IPs.
#
# Security:
#   * Default (Option A, tunnel): NO 'ports:' mapping -> not exposed to the
#     internet at all, no firewall access required. Verify: nmap shows filtered.
#   * Option B (direct): open the port only to your PC IPs, never 0.0.0.0/0.
#   * Use strong, unique passwords in .env.
# ======================================================

services:
  mariadb:
    image: mariadb:11
    container_name: yt-downloader-db
    restart: unless-stopped
    environment:
      # Database created automatically on first start.
      MARIADB_DATABASE: ${DB_DATABASE:-history}
      # Dedicated user the yt-downloader app connects as.
      MARIADB_USER: ${DB_USER:?set DB_USER in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Root/admin password (also used for backups/manage, not by the app).
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      # Persistent data -- survives container rebuilds/upgrades.
      - mariadb_data:/var/lib/mysql
    # Default: NO host port -> MariaDB is only reachable inside docker networks
    # (e.g. the Cloudflare tunnel). Do NOT uncomment for tunnel mode.
    # Only for direct-VPS-IP mode (Option B) + firewall restricted to your PCs:
    # ports:
    #   - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mariadb_data:
